name: Deploy

# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers: edit) and
# CLOUDFLARE_ACCOUNT_ID. Without them, use Workers Builds from the Cloudflare
# dashboard instead and delete this file.
on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'art/**', 'pnpm-lock.yaml']
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
